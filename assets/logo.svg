<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé spectral thermique officiel Antigravity -->
    <linearGradient id="ag-spectrum-clean" x1="12%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="26%" stop-color="#06b6d4" />
      <stop offset="52%" stop-color="#10b981" />
      <stop offset="78%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Ombre douce sous le logo interne -->
    <filter id="ag-inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Le cadre arrondi remplit 100 % du canvas (coins extérieurs transparents) -->
  <rect width="120" height="120" rx="30" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Logo Antigravity vectoriel exact et épuré -->
  <g filter="url(#ag-inner-shadow)">
    <!-- Boucle bleue vers le centre -->
    <path d="M 38 32 C 48 24, 72 24, 82 36 C 92 48, 88 68, 72 76 C 62 81, 48 76, 42 66" 
          stroke="url(#ag-spectrum-clean)" 
          stroke-width="9" 
          stroke-linecap="round"/>

    <!-- Boucle rouge vers le centre -->
    <path d="M 82 88 C 72 96, 48 96, 38 84 C 28 72, 32 52, 48 44 C 58 39, 72 44, 78 54" 
          stroke="url(#ag-spectrum-clean)" 
          stroke-width="9" 
          stroke-linecap="round"/>

    <!-- Pôles d'entrée magnétiques -->
    <circle cx="38" cy="32" r="5" fill="#2563eb"/>
    <circle cx="82" cy="88" r="5" fill="#ef4444"/>
  </g>
</svg>
